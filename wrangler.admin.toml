name = "reedance-catalog-admin"
main = "src/workers/admin.js"
compatibility_date = "2025-11-01"
# Hide the default workers.dev route. Still cover preview/version URLs with Access.
workers_dev = false

[vars]
ENVIRONMENT = "production"
CATALOG_KEY_ID = "cat-REPLACE_ME"
ALLOWED_MANIFEST_HOSTS = "dl.reedance.ir"
ALLOWED_COVER_HOSTS = "dl.reedance.ir"
SUPPORTED_LANGUAGE_CODES = "en,es,ko"
ADMIN_ORIGIN = "https://admin-catalog.reedance.ir"
ACCESS_TEAM_DOMAIN = "REPLACE_TEAM.cloudflareaccess.com"
ACCESS_AUD = "REPLACE_ACCESS_AUD"
ACCESS_ALLOWED_EMAILS = "owner@example.com"

# Replace database_id after: npx wrangler d1 create reedance-catalog
[[d1_databases]]
binding = "DB"
database_name = "reedance-catalog"
database_id = "57452c75-21a4-412f-95a1-820ffe004075"
migrations_dir = "migrations"

# Secrets (never commit). Zero Trust/Access is optional and asks for a card;
# the free path is ADMIN_SHARED_SECRET instead of ACCESS_* :
#   npx wrangler secret put CATALOG_SIGNING_PKCS8 --config wrangler.admin.toml
#   npx wrangler secret put ADMIN_SHARED_SECRET --config wrangler.admin.toml
